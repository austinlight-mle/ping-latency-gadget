name: Build and release

# Every push to main builds the Windows app and every kind of macOS download (universal, Apple
# silicon, Intel, disk image). If the version in the VERSION file has no release yet, release
# "v<version>" is published with all of them. Otherwise the builds replace the pre-release
# "latest-build", so the newest commit on main can always be downloaded: bump VERSION to publish
# a proper release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two quick pushes can't both try to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d ' \t\r\n' < VERSION)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION must be three numbers like 1.2.3 (found '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$version already exists, so this build won't be published. Bump VERSION to publish a new release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Build Windows app
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Check version
        shell: pwsh
        run: |
          $v = (Get-Item bin\PingGadget.exe).VersionInfo.ProductVersion
          if ($v -ne '${{ needs.version.outputs.version }}') { throw "PingGadget.exe has version '$v'" }
          "PingGadget.exe version $v"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: bin/PingGadget.exe
          if-no-files-found: error

  macos:
    name: Build macOS app
    needs: version
    # Pinned rather than macos-latest: the app still supports Intel Macs on macOS 10.13, and
    # this image's Xcode 16 can build for that.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        # The certificate from the developer's Mac (macos/export-signing-identity.sh), so every
        # release is signed the same way and Macs keep their Accessibility grant across updates.
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: sh macos/build.sh
      - name: Check the downloads
        run: |
          set -e
          cd macos/bin
          check() { # <download> <expected architectures>
            dir=$(mktemp -d)
            case "$1" in
              *.zip) ditto -x -k "$1" "$dir" ; app="$dir/PingGadget.app" ;;
              *.dmg) hdiutil attach -quiet -readonly -nobrowse -mountpoint "$dir/mnt" "$1"; app="$dir/mnt/PingGadget.app" ;;
            esac
            v=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
            archs=$(lipo -archs "$app/Contents/MacOS/PingGadget")
            min=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
            codesign --verify --deep --strict "$app"
            case "$1" in *.dmg) hdiutil detach -quiet "$dir/mnt" ;; esac
            if [ "$v" != "${{ needs.version.outputs.version }}" ]; then
              echo "::error::$1 has version '$v'"; exit 1
            fi
            if [ "$archs" != "$2" ]; then
              echo "::error::$1 has architectures '$archs', expected '$2'"; exit 1
            fi
            echo "$1: version $v, $archs, macOS $min+, signature OK"
          }
          check PingGadget-macOS.zip "x86_64 arm64"
          check PingGadget-macOS-AppleSilicon.zip "arm64"
          check PingGadget-macOS-Intel.zip "x86_64"
          check PingGadget-macOS.dmg "x86_64 arm64"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            macos/bin/PingGadget-macOS.zip
            macos/bin/PingGadget-macOS-AppleSilicon.zip
            macos/bin/PingGadget-macOS-Intel.zip
            macos/bin/PingGadget-macOS.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > notes.md << 'EOF'
          ## Downloads

          | | File |
          |---|---|
          | **Windows** | `PingGadget.exe`: run it (it asks for administrator rights) |
          | **Mac, any** (recommended) | `PingGadget-macOS.zip`: universal, Intel and Apple silicon |
          | **Mac, as a disk image** | `PingGadget-macOS.dmg`: universal; open it and drag Ping Gadget to Applications |
          | **Mac with Apple silicon** (M1 and later) | `PingGadget-macOS-AppleSilicon.zip`: macOS 11 or later, smallest download |
          | **Mac with Intel** | `PingGadget-macOS-Intel.zip`: macOS 10.13 or later |

          Not sure which Mac you have? Apple menu → About This Mac: "Chip: Apple M…" is Apple silicon, "Processor: … Intel" is Intel. The universal zip works on both.

          **macOS:** unzip and move `PingGadget.app` to Applications. The app isn't notarized by Apple, so the first launch needs **Open Anyway** (System Settings → Privacy & Security) or Control-click → **Open**. If macOS says it's damaged, run `xattr -dr com.apple.quarantine /Applications/PingGadget.app`. See the macOS README.
          EOF

      - name: Publish v${{ needs.version.outputs.version }}
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ping Gadget $VERSION" --notes-file notes.md --generate-notes

      - name: Update the latest-build pre-release
        if: needs.version.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          {
            echo "The newest build from \`main\` (commit $short), replaced on every push. It isn't a numbered release: for the latest stable version, see the release marked **Latest**."
            echo
            cat notes.md
          } > prerelease.md
          # Recreate it so the tag moves to this commit and only this build's files are attached.
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create latest-build dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Latest build from main ($VERSION, $short)" --notes-file prerelease.md
